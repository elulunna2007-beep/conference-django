{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<div class="form-card">
  <h1>Регистрация</h1>
  <form method="post">{% csrf_token %}
    {% if form.non_field_errors %}<div class="form-error">{{ form.non_field_errors }}</div>{% endif %}
    {% for field in form %}{% include "_field.html" %}{% endfor %}
    <button class="btn">Зарегистрироваться</button>
  </form>
  <p class="meta">Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
</div>
{% endblock %}
