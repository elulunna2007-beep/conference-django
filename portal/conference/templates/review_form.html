{% extends "base.html" %}
{% block title %}Отзыв{% endblock %}
{% block content %}
<div class="form-card">
  <h1>Отзыв о мероприятии</h1>
  <p class="meta">{{ application.event.title }}, {{ application.event.starts_at|date:"j E Y" }}</p>
  <form method="post">{% csrf_token %}
    {% for field in form %}{% include "_field.html" %}{% endfor %}
    <button class="btn">Отправить отзыв</button>
  </form>
</div>
{% endblock %}
