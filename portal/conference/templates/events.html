{% extends "base.html" %}
{% load static %}
{% block title %}Мероприятия{% endblock %}
{% block content %}
<div class="page-title"><h1>Мероприятия</h1></div>
<form class="filters" method="get">
  <div class="field"><label for="q">Название</label><input type="text" id="q" name="q" value="{{ q }}" placeholder="Например, Python"></div>
  <div class="field"><label for="city">Город</label>
    <select id="city" name="city">
      <option value="">Все города</option>
      {% for c in cities %}<option value="{{ c }}" {% if c == city %}selected{% endif %}>{{ c }}</option>{% endfor %}
    </select>
  </div>
  <button class="btn">Найти</button>
</form>
<div class="cards">
  {% for event in events %}{% include "_event_card.html" %}{% empty %}<p>Ничего не найдено. Попробуйте изменить название или город.</p>{% endfor %}
</div>
{% endblock %}
